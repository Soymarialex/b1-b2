<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba final</title>
  <link rel="stylesheet" href="style.css?v=1.0">
  <style>
    :root {
      --primary-color: #FF79AC;
      --secondary-color: #FFEBF2;
      --button-bg: #FFB3D1;
      --text-color: #121118;
      --bg-color: #FFFFFF;
      --feedback-success: #D4EDDA;
      --feedback-error: #F8D7DA;
      --box-bg: #F9F9F9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Platform Medium', 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .main-container {
      width: 100%;
      max-width: 820px;
      margin: 40px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h1 {
      font-size: 2.3rem;
      font-weight: bold;
      color: var(--primary-color);
      text-align: left;
    }

    .indication {
      font-size: 1rem;
      color: var(--text-color);
    }

    h2 {
      font-size: 1.6rem;
      color: var(--primary-color);
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 4px;
      margin-top: 5px;
      text-transform: lowercase;
    }

    .level-nav {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }

    .btn-level {
      background-color: var(--button-bg);
      border: none;
      border-bottom: 3px solid var(--primary-color);
      border-radius: 5px;
      color: var(--text-color);
      font-size: 0.9rem;
      padding: 6px 16px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-level.active {
      background-color: var(--primary-color);
      color: #FFFFFF;
      font-weight: bold;
    }

    .sentences-container {
      background-color: var(--box-bg);
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .sentence-item {
      font-size: 1.05rem;
      line-height: 1.6;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .gap-input {
      display: inline-block;
      height: 32px;
      border: none;
      border-bottom: 2px solid #888888;
      background: transparent;
      font-family: inherit;
      font-size: 1rem;
      font-weight: bold;
      color: var(--text-color);
      text-align: center;
      padding: 0 8px;
      border-radius: 4px;
      outline: none;
      transition: background-color 0.3s, border-color 0.3s;
    }

    .gap-input:focus {
      border-bottom: 2px solid var(--primary-color);
      background-color: var(--secondary-color);
    }

    .gap-input.correct {
      background-color: var(--feedback-success) !important;
      border-bottom: 2px solid #28a745 !important;
      color: #155724;
    }

    .gap-input.wrong {
      background-color: var(--feedback-error) !important;
      border-bottom: 2px solid #dc3545 !important;
      color: #721c24;
    }

    .btn-answers {
      align-self: flex-start;
      background-color: var(--button-bg);
      border: none;
      border-bottom: 3px solid var(--primary-color);
      border-radius: 5px;
      color: var(--text-color);
      font-size: 0.95rem;
      font-weight: bold;
      padding: 8px 18px;
      cursor: pointer;
      font-family: inherit;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-answers:active {
      transform: translateY(1px);
    }

    .answers-container {
      background-color: var(--box-bg);
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-left: 4px solid var(--primary-color);
    }

    .answers-container p {
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .answers-container strong {
      color: var(--text-color);
      font-weight: bold;
    }

    .hint-text {
      color: #666666;
      font-style: italic;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <h1>Prueba final</h1>
    
    <p class="indication">Completa con la conjugación del verbo que está entre paréntesis</p>
    
    <h2>test your memory</h2>

    <div class="level-nav">
      <button class="btn-level active" onclick="loadLevel(1)">Nivel 1</button>
      <button class="btn-level" onclick="loadLevel(2)">Nivel 2</button>
    </div>

    <div class="sentences-container" id="sentencesContainer">
      <!-- Las oraciones con casillas de texto se cargarán dinámicamente -->
    </div>

    <button class="btn-answers" onclick="toggleAnswers()">Respuestas correctas</button>

    <div class="answers-container" id="answersContainer" style="display: none;">
      <!-- Las respuestas correctas se desplegarán aquí -->
    </div>
  </div>

  <script>
    const levelsData = {
      1: {
        sentences: [
          {
            hint: "(nacer)",
            parts: [
              { text: "Esta es la casa donde " },
              { input: true, answer: "nació", width: 85 },
              { text: " Cervantes." }
            ]
          },
          {
            hint: "(nosotros comer)",
            parts: [
              { text: "Me gustó mucho el restaurante donde " },
              { input: true, answer: "comimos", width: 95 },
              { text: " ayer." }
            ]
          },
          {
            hint: "(Yo querer - presente)",
            parts: [
              { text: "Este es el lugar donde " },
              { input: true, answer: "quiero", width: 85 },
              { text: " construir el chalé." }
            ]
          },
          {
            hint: "(Yo conocer - pasado)",
            parts: [
              { text: "Es aquí donde " },
              { input: true, answer: "conocí", width: 85 },
              { text: " a Marisa." }
            ]
          },
          {
            hint: "(ir)",
            parts: [
              { text: "Esta es la piscina adonde " },
              { input: true, answer: "van", width: 60 },
              { text: " los niños cada verano." }
            ]
          },
          {
            hint: "(nosotros ir)",
            parts: [
              { input: true, answer: "vamos", width: 85 },
              { text: " adonde tú quieras." }
            ]
          }
        ],
        answers: [
          "Esta es la casa donde <strong>nació</strong> Cervantes.",
          "Me gustó mucho el restaurante donde <strong>comimos</strong> ayer.",
          "Este es el lugar donde <strong>quiero</strong> construir el chalé.",
          "Es aquí donde <strong>conocí</strong> a Marisa.",
          "Esta es la piscina adonde <strong>van</strong> los niños cada verano.",
          "<strong>vamos</strong> adonde tú quieras."
        ]
      },
      2: {
        sentences: [
          {
            hint: "(yo viajar)",
            parts: [
              { text: "Es en verano cuando más " },
              { input: true, answer: "viajo", width: 75 },
              { text: "." }
            ]
          },
          {
            hint: "(conocer tú y yo en el pasado)",
            parts: [
              { text: "2007 fue el año cuando nos " },
              { input: true, answer: "conocimos", width: 110 },
              { text: "." }
            ]
          },
          {
            hint: "(yo hacer en el futuro)",
            parts: [
              { text: "Lo " },
              { input: true, answer: "haré", width: 70 },
              { text: " cuando tú digas." }
            ]
          },
          {
            hint: "(imperativo venir - tú)",
            parts: [
              { input: true, answer: "Ven", width: 65 },
              { text: " cuando quieras." }
            ]
          },
          {
            hint: "(terminar - pasado)",
            parts: [
              { text: "El partido " },
              { input: true, answer: "terminó", width: 95 },
              { text: " como yo pensaba." }
            ]
          },
          {
            hint: "(hacer él - pasado)",
            parts: [
              { text: "Lo " },
              { input: true, answer: "hizo", width: 70 },
              { text: " como él quiso." }
            ]
          }
        ],
        answers: [
          "Es en verano cuando más <strong>viajo</strong>.",
          "2007 fue el año cuando nos <strong>conocimos</strong>.",
          "Lo <strong>haré</strong> cuando tú digas.",
          "<strong>Ven</strong> cuando quieras.",
          "El partido <strong>terminó</strong> como yo pensaba.",
          "Lo <strong>hizo</strong> como él quiso."
        ]
      }
    };

    let currentLevel = 1;

    function loadLevel(levelNum) {
      currentLevel = levelNum;

      // Ocultar respuestas al cambiar de nivel
      const answersContainer = document.getElementById('answersContainer');
      answersContainer.style.display = 'none';

      // Actualizar estado activo de los botones de nivel
      const levelBtns = document.querySelectorAll('.btn-level');
      levelBtns.forEach((btn, index) => {
        if (index + 1 === levelNum) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      // Cargar oraciones
      const sentencesContainer = document.getElementById('sentencesContainer');
      sentencesContainer.innerHTML = '';
      const currentSentences = levelsData[levelNum].sentences;

      currentSentences.forEach((sentenceObj) => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'sentence-item';

        sentenceObj.parts.forEach(part => {
          if (part.input) {
            const inputElem = document.createElement('input');
            inputElem.type = 'text';
            inputElem.className = 'gap-input';
            inputElem.style.width = (part.width || 70) + 'px';
            inputElem.dataset.answer = part.answer;
            inputElem.autocomplete = 'off';
            inputElem.autocorrect = 'off';
            inputElem.autocapitalize = 'off';
            inputElem.spellcheck = false;

            // Validar ÚNICAMENTE al presionar Enter y saltar a la siguiente casilla
            inputElem.addEventListener('keydown', (e) => {
              if (e.key === 'Enter') {
                e.preventDefault();
                validateInput(inputElem);
                
                const allInputs = Array.from(document.querySelectorAll('.gap-input'));
                const currentIndex = allInputs.indexOf(inputElem);
                if (currentIndex !== -1 && currentIndex < allInputs.length - 1) {
                  allInputs[currentIndex + 1].focus();
                  allInputs[currentIndex + 1].select();
                }
              }
            });

            itemDiv.appendChild(inputElem);
          } else {
            const textSpan = document.createElement('span');
            textSpan.textContent = part.text;
            itemDiv.appendChild(textSpan);
          }
        });

        // Añadir pista en paréntesis
        if (sentenceObj.hint) {
          const hintSpan = document.createElement('span');
          hintSpan.className = 'hint-text';
          hintSpan.textContent = sentenceObj.hint;
          itemDiv.appendChild(hintSpan);
        }

        sentencesContainer.appendChild(itemDiv);
      });

      // Enfocar automáticamente la primera casilla del nivel
      const firstInput = document.querySelector('.gap-input');
      if (firstInput) {
        firstInput.focus();
      }
    }

    function validateInput(inputElem) {
      const userValue = inputElem.value;
      const expectedAnswer = inputElem.dataset.answer;

      if (userValue.trim() === '') {
        inputElem.classList.remove('correct', 'wrong');
        return;
      }

      // Comparación flexible: ignora mayúsculas/minúsculas y tildes
      if (normalizeText(userValue) === normalizeText(expectedAnswer)) {
        inputElem.classList.remove('wrong');
        inputElem.classList.add('correct');
      } else {
        inputElem.classList.remove('correct');
        inputElem.classList.add('wrong');
      }
    }

    // Normaliza el texto removiendo tildes y convirtiendo a minúsculas
    function normalizeText(text) {
      return text
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function toggleAnswers() {
      const answersContainer = document.getElementById('answersContainer');
      if (answersContainer.style.display === 'none') {
        const answersList = levelsData[currentLevel].answers;
        answersContainer.innerHTML = answersList.map(ans => `<p>${ans}</p>`).join('');
        answersContainer.style.display = 'flex';
      } else {
        answersContainer.style.display = 'none';
      }
    }

    window.onload = function() {
      loadLevel(1);
    };
  </script>
</body>
</html>
