<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba final</title>
  <link rel="stylesheet" href="style.css?v=1.0">
  <style>
    :root {
      --primary-color: #FF79AC;
      --secondary-color: #FFEBF2;
      --button-bg: #FFB3D1;
      --text-color: #121118;
      --bg-color: #FFFFFF;
      --feedback-success: #D4EDDA;
      --feedback-error: #F8D7DA;
      --box-bg: #F9F9F9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Platform Medium', 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .main-container {
      width: 100%;
      max-width: 820px;
      margin: 40px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h1 {
      font-size: 2.3rem;
      font-weight: bold;
      color: var(--primary-color);
      text-align: left;
    }

    .indication {
      font-size: 1rem;
      color: var(--text-color);
    }

    h2 {
      font-size: 1.6rem;
      color: var(--primary-color);
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 4px;
      margin-top: 5px;
      text-transform: lowercase;
    }

    .level-nav {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }

    .btn-level {
      background-color: var(--button-bg);
      border: none;
      border-bottom: 3px solid var(--primary-color);
      border-radius: 5px;
      color: var(--text-color);
      font-size: 0.9rem;
      padding: 6px 16px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-level.active {
      background-color: var(--primary-color);
      color: #FFFFFF;
      font-weight: bold;
    }

    .sentences-container {
      background-color: var(--box-bg);
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .sentence-item {
      font-size: 1.05rem;
      line-height: 1.6;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    /* Campos de texto interactivos (casillas) */
    .gap-input {
      display: inline-block;
      height: 32px;
      border: none;
      border-bottom: 2px solid #888888;
      background: transparent;
      font-family: inherit;
      font-size: 1rem;
      font-weight: bold;
      color: var(--text-color);
      text-align: center;
      padding: 0 8px;
      border-radius: 4px;
      outline: none;
      transition: background-color 0.3s, border-color 0.3s;
    }

    .gap-input:focus {
      border-bottom: 2px solid var(--primary-color);
      background-color: var(--secondary-color);
    }

    .gap-input.correct {
      background-color: var(--feedback-success) !important;
      border-bottom: 2px solid #28a745 !important;
      color: #155724;
    }

    .gap-input.wrong {
      background-color: var(--feedback-error) !important;
      border-bottom: 2px solid #dc3545 !important;
      color: #721c24;
    }

    .btn-answers {
      align-self: flex-start;
      background-color: var(--button-bg);
      border: none;
      border-bottom: 3px solid var(--primary-color);
      border-radius: 5px;
      color: var(--text-color);
      font-size: 0.95rem;
      font-weight: bold;
      padding: 8px 18px;
      cursor: pointer;
      font-family: inherit;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-answers:active {
      transform: translateY(1px);
    }

    .answers-container {
      background-color: var(--box-bg);
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-left: 4px solid var(--primary-color);
    }

    .answers-container p {
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .answers-container strong {
      color: var(--text-color);
      font-weight: bold;
    }

    .hint-text {
      color: #666666;
      font-style: italic;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <h1>Prueba final</h1>
    
    <p class="indication">Completa con el pronombre personal de Objeto Directo e Indirecto según corresponda.</p>
    
    <h2>test your memory</h2>

    <div class="level-nav">
      <button class="btn-level active" onclick="loadLevel(1)">Nivel 1</button>
      <button class="btn-level" onclick="loadLevel(2)">Nivel 2</button>
      <button class="btn-level" onclick="loadLevel(3)">Nivel 3</button>
      <button class="btn-level" onclick="loadLevel(4)">Nivel 4</button>
    </div>

    <div class="sentences-container" id="sentencesContainer">
      <!-- Las oraciones con casillas de texto se cargarán dinámicamente -->
    </div>

    <button class="btn-answers" onclick="toggleAnswers()">Respuestas correctas</button>

    <div class="answers-container" id="answersContainer" style="display: none;">
      <!-- Las respuestas correctas se desplegarán aquí -->
    </div>
  </div>

  <script>
    const levelsData = {
      1: {
        sentences: [
          {
            hint: "(dar a él)",
            parts: [
              { text: "Roberto necesita el coche. " },
              { input: true, answer: "Dale", width: 65 },
              { text: " las llaves." }
            ]
          },
          {
            hint: "(dar las gafas a ella)",
            parts: [
              { text: "Esas gafas son de Lola. " },
              { input: true, answer: "Dáselas", width: 85 },
              { text: "." }
            ]
          },
          {
            hint: "(poner a ti)",
            parts: [
              { input: true, answer: "Ponte", width: 70 },
              { text: " un jersey; hace frío." }
            ]
          },
          {
            hint: "(vender el coche)",
            parts: [
              { text: "Ese coche ya está muy viejo. " },
              { input: true, answer: "Véndelo", width: 85 },
              { text: "." }
            ]
          },
          {
            hint: "(decir a mí)",
            parts: [
              { input: true, answer: "Dime", width: 65 },
              { text: " la verdad." }
            ]
          },
          {
            hint: "(dar el libro a mí)",
            parts: [
              { text: "¿Es tuyo este libro? —Sí, " },
              { input: true, answer: "dámelo", width: 80 },
              { text: "." }
            ]
          }
        ],
        answers: [
          "Roberto necesita el coche. <strong>Dale</strong> las llaves.",
          "Esas gafas son de Lola. <strong>Dáselas</strong>.",
          "<strong>Ponte</strong> un jersey; hace frío.",
          "Ese coche ya está muy viejo. <strong>Véndelo</strong>.",
          "<strong>Dime</strong> la verdad.",
          "¿Es tuyo este libro? —Sí, <strong>dámelo</strong>."
        ]
      },
      2: {
        sentences: [
          {
            hint: "(tú no mirar a mí)",
            parts: [
              { text: "No " },
              { input: true, answer: "me", width: 45 },
              { text: " " },
              { input: true, answer: "mires", width: 65 },
              { text: "." }
            ]
          },
          {
            hint: "(tú no decir a mí)",
            parts: [
              { text: "No " },
              { input: true, answer: "me", width: 45 },
              { text: " " },
              { input: true, answer: "digas", width: 65 },
              { text: " nada." }
            ]
          },
          {
            hint: "(tú no enseñar el libro a mí)",
            parts: [
              { text: "No me gusta ese libro. No " },
              { input: true, answer: "me", width: 45 },
              { text: " " },
              { input: true, answer: "lo", width: 45 },
              { text: " " },
              { input: true, answer: "enseñes", width: 85 },
              { text: "." }
            ]
          },
          {
            hint: "(tú no dar las gafas a él o ella)",
            parts: [
              { text: "Esas gafas no son suyas. No " },
              { input: true, answer: "se", width: 45 },
              { text: " " },
              { input: true, answer: "las", width: 45 },
              { text: " " },
              { input: true, answer: "des", width: 50 },
              { text: "." }
            ]
          },
          {
            hint: "(tú no cortar a ti mismo)",
            parts: [
              { text: "Ten cuidado. No " },
              { input: true, answer: "te", width: 45 },
              { text: " " },
              { input: true, answer: "cortes", width: 70 },
              { text: "." }
            ]
          },
          {
            hint: "(hacer algo)",
            parts: [
              { input: true, answer: "Hacerlo", width: 80 },
              { text: " es complicado." }
            ]
          }
        ],
        answers: [
          "No <strong>me</strong> <strong>mires</strong>.",
          "No <strong>me</strong> <strong>digas</strong> nada.",
          "No me gusta. No <strong>me</strong> <strong>lo</strong> <strong>enseñes</strong>.",
          "Esas gafas no son suyas. No <strong>se</strong> <strong>las</strong> <strong>des</strong>.",
          "Ten cuidado. No <strong>te</strong> <strong>cortes</strong>.",
          "<strong>Hacerlo</strong> es complicado."
        ]
      },
      3: {
        sentences: [
          {
            hint: "(decir algo a él o a ella)",
            parts: [
              { text: "Es inútil " },
              { input: true, answer: "decírselo", width: 95 },
              { text: "." }
            ]
          },
          {
            hint: "(hablar a él o a ella)",
            parts: [
              { text: "Es muy terco, es imposible " },
              { input: true, answer: "hablarle", width: 85 },
              { text: "." }
            ]
          },
          {
            hint: "(contar algo a él o a ella)",
            parts: [
              { text: "Me gusta " },
              { input: true, answer: "contárselo", width: 100 },
              { text: "." }
            ]
          },
          {
            hint: "(entender algo)",
            parts: [
              { text: "Parece " },
              { input: true, answer: "entenderlo", width: 95 },
              { text: ", pero no estoy segura." }
            ]
          },
          {
            hint: "(odiar él a ella y ella a él)",
            parts: [
              { text: "Pedro y Ana parecen " },
              { input: true, answer: "odiarse", width: 80 },
              { text: "." }
            ]
          },
          {
            hint: "(ver a ti)",
            parts: [
              { text: "No quiero " },
              { input: true, answer: "verte", width: 65 },
              { text: ". / No " },
              { input: true, answer: "te", width: 45 },
              { text: " quiero " },
              { input: true, answer: "ver", width: 50 },
              { text: "." }
            ]
          }
        ],
        answers: [
          "Es inútil <strong>decírselo</strong>.",
          "Es muy terco, es imposible <strong>hablarle</strong>.",
          "Me gusta <strong>contárselo</strong>.",
          "Parece <strong>entenderlo</strong>, pero no estoy segura.",
          "Pedro y Ana parecen <strong>odiarse</strong>.",
          "No quiero <strong>verte</strong>. / No <strong>te</strong> quiero <strong>ver</strong>."
        ]
      },
      4: {
        sentences: [
          {
            hint: "(ella conocer a él y él conocer a ella)",
            parts: [
              { text: "Ruth y Carlos quieren " },
              { input: true, answer: "conocerse", width: 95 },
              { text: ". / Ruth y Carlos " },
              { input: true, answer: "se", width: 45 },
              { text: " quieren " },
              { input: true, answer: "conocer", width: 80 },
              { text: "." }
            ]
          },
          {
            hint: "(ayudar a mí)",
            parts: [
              { text: "¿Puedes " },
              { input: true, answer: "ayudarme", width: 90 },
              { text: "? / ¿" },
              { input: true, answer: "Me", width: 50 },
              { text: " puedes " },
              { input: true, answer: "ayudar", width: 75 },
              { text: "?" }
            ]
          },
          {
            hint: "(decir algo a él o a ella)",
            parts: [
              { input: true, answer: "Se", width: 45 },
              { text: " " },
              { input: true, answer: "lo", width: 45 },
              { text: " voy a decir. / Voy a " },
              { input: true, answer: "decírselo", width: 95 },
              { text: "." }
            ]
          },
          {
            hint: "(ver algo ahora mismo)",
            parts: [
              { text: "Estoy " },
              { input: true, answer: "viéndolo", width: 85 },
              { text: ". / " },
              { input: true, answer: "Lo", width: 45 },
              { text: " estoy " },
              { input: true, answer: "viendo", width: 75 },
              { text: "." }
            ]
          },
          {
            hint: "(buscar las llaves)",
            parts: [
              { text: "Sigo " },
              { input: true, answer: "buscándolas", width: 110 },
              { text: ". / " },
              { input: true, answer: "Las", width: 50 },
              { text: " sigo " },
              { input: true, answer: "buscando", width: 85 },
              { text: "." }
            ]
          },
          {
            hint: "(hacer algo)",
            parts: [
              { text: "Llevo un mes " },
              { input: true, answer: "haciéndolo", width: 100 },
              { text: ". / " },
              { input: true, answer: "Lo", width: 45 },
              { text: " llevo " },
              { input: true, answer: "haciendo", width: 85 },
              { text: " un mes." }
            ]
          }
        ],
        answers: [
          "Ruth y Carlos quieren <strong>conocerse</strong>. / Ruth y Carlos <strong>se</strong> quieren <strong>conocer</strong>.",
          "¿Puedes <strong>ayudarme</strong>? / ¿<strong>Me</strong> puedes <strong>ayudar</strong>?",
          "<strong>Se</strong> <strong>lo</strong> voy a decir. / Voy a <strong>decírselo</strong>.",
          "Estoy <strong>viéndolo</strong>. / <strong>Lo</strong> estoy <strong>viendo</strong>.",
          "Sigo <strong>buscándolas</strong>. / <strong>Las</strong> sigo <strong>buscando</strong>.",
          "Llevo un mes <strong>haciéndolo</strong>. / <strong>Lo</strong> llevo <strong>haciendo</strong> un mes."
        ]
      }
    };

    let currentLevel = 1;

    function loadLevel(levelNum) {
      currentLevel = levelNum;

      // Ocultar respuestas al cambiar de nivel
      const answersContainer = document.getElementById('answersContainer');
      answersContainer.style.display = 'none';

      // Actualizar botones de navegación
      const levelBtns = document.querySelectorAll('.btn-level');
      levelBtns.forEach((btn, index) => {
        if (index + 1 === levelNum) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      // Cargar oraciones
      const sentencesContainer = document.getElementById('sentencesContainer');
      sentencesContainer.innerHTML = '';
      const currentSentences = levelsData[levelNum].sentences;

      currentSentences.forEach((sentenceObj) => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'sentence-item';

        sentenceObj.parts.forEach(part => {
          if (part.input) {
            const inputElem = document.createElement('input');
            inputElem.type = 'text';
            inputElem.className = 'gap-input';
            inputElem.style.width = (part.width || 70) + 'px';
            inputElem.dataset.answer = part.answer;
            inputElem.autocomplete = 'off';
            inputElem.autocorrect = 'off';
            inputElem.autocapitalize = 'off';
            inputElem.spellcheck = false;

            // Validar únicamente al presionar Enter y saltar a la siguiente casilla
            inputElem.addEventListener('keydown', (e) => {
              if (e.key === 'Enter') {
                e.preventDefault();
                validateInput(inputElem);
                
                const allInputs = Array.from(document.querySelectorAll('.gap-input'));
                const currentIndex = allInputs.indexOf(inputElem);
                if (currentIndex !== -1 && currentIndex < allInputs.length - 1) {
                  allInputs[currentIndex + 1].focus();
                  allInputs[currentIndex + 1].select();
                }
              }
            });

            itemDiv.appendChild(inputElem);
          } else {
            const textSpan = document.createElement('span');
            textSpan.textContent = part.text;
            itemDiv.appendChild(textSpan);
          }
        });

        // Añadir pista entre paréntesis si existe
        if (sentenceObj.hint) {
          const hintSpan = document.createElement('span');
          hintSpan.className = 'hint-text';
          hintSpan.textContent = sentenceObj.hint;
          itemDiv.appendChild(hintSpan);
        }

        sentencesContainer.appendChild(itemDiv);
      });

      // Dar foco automáticamente a la primera casilla del nivel
      const firstInput = document.querySelector('.gap-input');
      if (firstInput) {
        firstInput.focus();
      }
    }

    function validateInput(inputElem) {
      const userValue = inputElem.value;
      const expectedAnswer = inputElem.dataset.answer;

      if (userValue.trim() === '') {
        inputElem.classList.remove('correct', 'wrong');
        return;
      }

      // Comparación flexible que ignora mayúsculas, minúsculas y tildes
      if (normalizeText(userValue) === normalizeText(expectedAnswer)) {
        inputElem.classList.remove('wrong');
        inputElem.classList.add('correct');
      } else {
        inputElem.classList.remove('correct');
        inputElem.classList.add('wrong');
      }
    }

    // Función para normalizar texto eliminando tildes y convirtiendo a minúsculas
    function normalizeText(text) {
      return text
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function toggleAnswers() {
      const answersContainer = document.getElementById('answersContainer');
      if (answersContainer.style.display === 'none') {
        const answersList = levelsData[currentLevel].answers;
        answersContainer.innerHTML = answersList.map(ans => `<p>${ans}</p>`).join('');
        answersContainer.style.display = 'flex';
      } else {
        answersContainer.style.display = 'none';
      }
    }

    window.onload = function() {
      loadLevel(1);
    };
  </script>
</body>
</html>
